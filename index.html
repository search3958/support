          keywords: "Sentaro, 支援, 幫助, FAQ, 使用指南, 疑難排解, 聯絡我們",
          heroTitle: "需要協助嗎？",

      };

      const ARTICLE_DESCRIPTIONS = {
        ad_error: {
          ja: "広告ブロッカーやブラウザのプライバシー設定に関する確認事項",
          en: "Things to check regarding ad blockers and browser privacy settings.",
          ko: "광고 차단 기능 및 브라우저 개인정보 보호 설정에 관한 확인 사항",
          kp: "광고막기 및 브라우저의 사생활 보호 설정에 관한 확인 사항",
          zh: "有关广告拦截器和浏览器隐私设置的检查事项",
          "zh-hk": "有關廣告攔截器及瀏覽器私隱設定的檢查事項"
        },
        newtab_setup: {
          ja: "ブラウザの新しいタブにNewtabを設定する手順",
          en: "Steps for setting Newtab as your browser's new tab page.",
          ko: "브라우저의 새 탭에 Newtab을 설정하는 방법",
          kp: "브라우저의 새 페지에 Newtab을 설정하는 방법",
          zh: "将 Newtab 设置为浏览器新标签页的步骤",
          "zh-hk": "將 Newtab 設定為瀏覽器新分頁的步驟"
        }
      };

      function getSelectedLang() {
        const value = localStorage.getItem("selectedLang");
        return Object.prototype.hasOwnProperty.call(LANGS, value) ? value : "ja";
      }

      function parseTitlesYaml(text) {
        const result = {};
        let currentKey = null;

        for (const rawLine of text.replace(/\r/g, "").split("\n")) {
          const line = rawLine.trimEnd();

          if (!line.trim() || line.trimStart().startsWith("#")) continue;

          const top = /^([A-Za-z0-9_-]+):$/.exec(line.trim());
          if (top) {
            currentKey = top[1];
            result[currentKey] = [];
            continue;
          }

          const item = /^\s*-\s*(.*)$/.exec(line);
          if (item && currentKey) {
            let value = item[1].trim();
            if (
              value.length >= 2 &&
              value.startsWith('"') &&
              value.endsWith('"')
            ) {
              try {
                value = JSON.parse(value);
              } catch (_) {
                value = value.slice(1, -1);
              }
            } else if (
              value.length >= 2 &&
              value.startsWith("'") &&
              value.endsWith("'")
            ) {
              value = value.slice(1, -1).replace(/''/g, "'");
            }
            result[currentKey].push(value);
          }
        }

        return result;
      }

      function applyLanguage(lang) {
        const ui = LANGS[lang];
        document.documentElement.lang = ui.htmlLang;
        document.title = ui.title;

        document.getElementById("page-title").textContent = ui.title;
        document.getElementById("meta-description").setAttribute("content", ui.description);
        document.getElementById("meta-keywords").setAttribute("content", ui.keywords);
        document.getElementById("og-title").setAttribute("content", ui.title);
        document.getElementById("og-description").setAttribute("content", ui.description);
        document.getElementById("og-locale").setAttribute("content", ui.locale);

        document.getElementById("hero-title").textContent = ui.heroTitle;
        document.getElementById("hero-description").textContent = ui.description;
        document.getElementById("recent-title").textContent = ui.recentTitle;
        document.getElementById("support-contact-title").textContent = ui.contactTitle;
        document.getElementById("support-contact-description").textContent = ui.contactDescription;
        document.getElementById("support-contact-button").textContent = ui.contactButton;
      }

      function renderArticles(titleMap, lang) {
        const list = document.getElementById("docs-list");
        list.textContent = "";

        const languageCodes = Array.isArray(titleMap.filename)
          ? titleMap.filename
          : Object.keys(LANGS);

        const langIndex = languageCodes.indexOf(lang);
        const fallbackIndex = languageCodes.indexOf("ja");
        const index = langIndex >= 0 ? langIndex : fallbackIndex >= 0 ? fallbackIndex : 0;

        const slugs = Object.keys(titleMap).filter((key) => key !== "filename");

        if (!slugs.length) {
          const empty = document.createElement("p");
          empty.className = "error";
          empty.textContent = LANGS[lang].empty;
          list.appendChild(empty);
          return;
        }

        for (const slug of slugs) {
          const titles = Array.isArray(titleMap[slug]) ? titleMap[slug] : [];
          const title = titles[index] || titles[fallbackIndex] || slug;

          const link = document.createElement("a");
          link.className = "item";
          link.href = `./docs/${lang}/${encodeURIComponent(slug)}.html`;

          const strong = document.createElement("strong");
          strong.textContent = title;

          const span = document.createElement("span");
          span.textContent =
            ARTICLE_DESCRIPTIONS[slug]?.[lang] ??
            ARTICLE_DESCRIPTIONS[slug]?.ja ??
            slug;

          link.append(strong, span);
          list.appendChild(link);
        }
      }

      async function init() {
        const lang = getSelectedLang();
        applyLanguage(lang);

        try {
          const response = await fetch("./docs/titles.yaml", { cache: "no-cache" });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);

          const yamlText = await response.text();
          const titleMap = parseTitlesYaml(yamlText);

          // Keep the parsed YAML available to the page for other scripts.
          window.supportTitles = titleMap;

          renderArticles(titleMap, lang);
        } catch (error) {
          console.error("[Sentaro Support] Failed to load titles.yaml.", error);

          const list = document.getElementById("docs-list");
          list.textContent = "";
          const errorMessage = document.createElement("p");
          errorMessage.className = "error";
          errorMessage.textContent = LANGS[lang].error;
          list.appendChild(errorMessage);
        }
      }

      document.getElementById("support-contact-button").addEventListener("click", () => {
        window.location.href = CONTACT_FORM_URL;
      });

      init();
    })();
