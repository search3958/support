<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
  <meta charset="UTF-8">
  <title>{{TITLE}}</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="https://search3958.github.io/project/logos/3958logo_main.svg">

  <meta name="description" content="{{DESCRIPTION}}">
  <meta name="keywords" content="{{KEYWORDS}}">
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">

  <link rel="canonical" href="{{CANONICAL}}">

  <meta property="og:type" content="article">
  <meta property="og:title" content="{{TITLE}}">
  <meta property="og:description" content="{{DESCRIPTION}}">
  <meta property="og:url" content="{{CANONICAL}}">
  <meta property="og:site_name" content="{{SITE_NAME}}">
  <meta property="og:image" content="https://search3958.github.io/project/logos/3958logo_main.svg">
{{OG_ALTERNATES}}
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{TITLE}}">
  <meta name="twitter:description" content="{{DESCRIPTION}}">
  <meta name="twitter:image" content="https://search3958.github.io/project/logos/3958logo_main.svg">

{{HREFLANG}}

  <script type="application/ld+json">
{{JSONLD_WEBPAGE}}
  </script>

  <script type="application/ld+json">
{{JSONLD_BREADCRUMB}}
  </script>

  <link rel="stylesheet" href="../style.css">

</head>

<body>

  <script src="https://search3958.github.io/frameworks/headerv2.js"></script>

  <section class="support-markdown-container" aria-label="{{ARIA_LABEL}}">
    <div id="support-markdown" class="support-markdown">
      <p id="support-loading">{{LOADING}}</p>
    </div>
  </section>

  <div
    class="xincard"
    style="
      padding:48px 0;
      background-image:
        conic-gradient(
          from 247deg,
          rgba(58,255,160,1) 0deg,
          rgba(0,255,246,1) 0deg,
          rgba(58,255,160,1) 180deg,
          rgba(255,255,255,1) 180deg,
          rgba(88,255,239,1) 227deg,
          rgba(0,242,105,1) 360deg
        );
    "
  >
    <span
      id="support-contact-title"
      class="app-name"
      style="--xin-delay:0.16s;font-size:40px;"
    >
      {{CONTACT_TITLE}}
    </span>

    <div class="small" style="--xin-delay:0.08s;font-size:24px;">
      {{CONTACT_DESCRIPTION}}
    </div>

    <button
      id="support-contact-button"
      class="primary-btn"
      type="button"
      style="--xin-delay:0.24s;background:#fff;color:#000;"
    >
      {{CONTACT_BUTTON}}
    </button>
  </div>

  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6151036058675874"
    crossorigin="anonymous"></script>

  <ins
    class="adsbygoogle"
    style="display:block"
    data-ad-client="ca-pub-6151036058675874"
    data-ad-slot="2470646390"
    data-ad-format="auto"
    data-full-width-responsive="true"
  ></ins>

  <script>
    (() => {
      "use strict";

      const LOG_PREFIX = "[Sentaro Support]";
      const CONTACT_FORM_URL =
        "https://docs.google.com/forms/d/e/1FAIpQLSegCKF2UdLdEA7cQ6y3PS3vlZ8fT29KnEyo26RDl15ocIM1Ig/viewform?usp=sharing&ouid=116246090197695118669";

      const markdownText = {{MARKDOWN_JSON}};
      const markdownTarget = document.getElementById("support-markdown");
      const contactButton = document.getElementById("support-contact-button");

      if (contactButton) {
        contactButton.addEventListener("click", () => {
          window.location.href = CONTACT_FORM_URL;
        });
      }

      const renderError = (message) => {
        if (markdownTarget) {
          markdownTarget.innerHTML =
            '<div class="markdown-error"></div>';
          const error = markdownTarget.querySelector(".markdown-error");
          if (error) error.textContent = message;
        }
      };

      if (!markdownTarget) {
        console.error(`${LOG_PREFIX} Markdown target element was not found.`);
        return;
      }

      if (!markdownText.trim()) {
        renderError({ERROR_EMPTY});
        return;
      }

      const renderMarkdown = () => {
        if (typeof window.marked === "undefined") {
          renderError({ERROR_MARKED});
          return false;
        }

        try {
          const renderedHtml = window.marked.parse(markdownText, {
            gfm: true,
            breaks: false
          });

          if (!renderedHtml) {
            renderError({ERROR_RENDER});
            return false;
          }

          markdownTarget.innerHTML = renderedHtml;
          return true;
        } catch (error) {
          console.error(`${LOG_PREFIX} Failed to render Markdown.`, error);
          renderError({ERROR_PARSE});
          return false;
        }
      };

      if (typeof window.marked !== "undefined") {
        renderMarkdown();
        return;
      }

      const markedScript = document.createElement("script");
      markedScript.src =
        "https://cdn.jsdelivr.net/npm/marked@18.0.13/lib/marked.umd.js";
      markedScript.async = true;

      markedScript.onload = renderMarkdown;
      markedScript.onerror = () => renderError({ERROR_MARKED});

      document.head.appendChild(markedScript);
    })();
  </script>

  <script>
    if (typeof window.adsbygoogle !== "undefined") {
      try {
        (adsbygoogle = window.adsbygoogle || []).push({});
      } catch (error) {
        console.error("[Sentaro Support] AdSense initialization failed.", error);
      }
    }
  </script>

  <script
    async
    src="https://www.googletagmanager.com/gtag/js?id=G-7N56NHPY3C"
  ></script>

  <script>
    window.dataLayer = window.dataLayer || [];

    function gtag() {
      dataLayer.push(arguments);
    }

    gtag("js", new Date());
    gtag("config", "G-7N56NHPY3C");
  </script>

  <script src="https://search3958.github.io/check.js?check=none"></script>

</body>
</html>
