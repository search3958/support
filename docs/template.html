  <script id="support-markdown-source" type="text/markdown">
# Sentaro サポート

Sentaroの各種プロダクトに関するサポート情報です。

ここでは、よくある質問や基本的な使い方、問題が発生した場合の確認事項を掲載しています。

---

## よくある質問

### ページが正常に表示されません

まず、以下を確認してください。

1. ページを再読み込みする
2. ブラウザを最新版に更新する
3. JavaScriptを有効にする
4. 別のブラウザでも確認する

それでも解決しない場合は、お問い合わせフォームからご連絡ください。

### データはどこに保存されますか？

プロダクトによって保存方法が異なります。

ブラウザ内だけで保存されるものや、外部サービスを利用するものがあります。

各プロダクトの案内をご確認ください。

### スマートフォンでも利用できますか？

対応しているプロダクトであればスマートフォンから利用できます。

ただし、PC向けに設計されたツールでは一部の機能が利用しにくい場合があります。

---

## サポートについて

お問い合わせの際には、次の情報があると確認しやすくなります。

- 利用しているプロダクト名
- 発生した問題
- 問題が発生した手順
- 使用しているブラウザ
- 表示されたエラーメッセージ

> 個人情報やパスワードなど、不要な情報は送信しないでください。

---

## 使い方の例

たとえば、文章を **太字** にしたり、`コード` を表示したりできます。

### リンク

[Sentaro ホーム](https://search3958.github.io/)

### コード

```javascript
const message = "Hello, Sentaro!";
console.log(message);
```

### 表

| 項目 | 内容 |
| --- | --- |
| 製品情報 | 各プロダクトの情報 |
| 使い方 | 基本的な操作方法 |
| FAQ | よくある質問 |
| お問い合わせ | サポートフォーム |

---

  <script>
    (() => {
      "use strict";

      const LOG_PREFIX = "[Sentaro Support]";

      const CONTACT_FORM_URL =
        "https://docs.google.com/forms/d/e/1FAIpQLSegCKF2UdLdEA7cQ6y3PS3vlZ8fT29KnEyo26RDl15ocIM1Ig/viewform?usp=sharing&ouid=116246090197695118669";

      const markdownSource =
        document.getElementById("support-markdown-source");

      if (!markdownSource) {
        console.error(
          `${LOG_PREFIX} Markdown source element was not found.`
        );
        return;
      }

      console.log(
        `${LOG_PREFIX} Markdown source element found.`
      );

      const markdownTarget =
        document.getElementById("support-markdown");

      if (!markdownTarget) {
        console.error(
          `${LOG_PREFIX} Markdown target element was not found.`
        );
        return;
      }

      console.log(
        `${LOG_PREFIX} Markdown target element found.`
      );

      const contactButton =
        document.getElementById("support-contact-button");

      if (!contactButton) {
        console.error(
          `${LOG_PREFIX} Contact button was not found.`
        );
      } else {
        console.log(
          `${LOG_PREFIX} Contact button found.`
        );

        contactButton.addEventListener("click", () => {
          console.log(
            `${LOG_PREFIX} Opening contact form.`
          );

          window.location.href = CONTACT_FORM_URL;
        });

        console.log(
          `${LOG_PREFIX} Contact button event registered.`
        );
      }

      const markdownText =
        markdownSource.textContent?.trim();

      if (!markdownText) {
        console.error(
          `${LOG_PREFIX} Markdown source is empty.`
        );

        markdownTarget.innerHTML = `
          <div class="markdown-error">
            Markdownの内容がありません。
          </div>
        `;

        return;
      }

      console.log(
        `${LOG_PREFIX} Markdown source loaded: ${markdownText.length} characters.`
      );

      const renderMarkdown = () => {
        if (typeof window.marked === "undefined") {
          console.error(
            `${LOG_PREFIX} marked is not available.`
          );

          markdownTarget.innerHTML = `
            <div class="markdown-error">
              Markdownパーサーの読み込みに失敗しました。
            </div>
          `;

          return false;
        }

        try {
          const renderedHtml = window.marked.parse(
            markdownText,
            {
              gfm: true,
              breaks: false
            }
          );

          if (!renderedHtml) {
            console.error(
              `${LOG_PREFIX} Markdown parser returned empty HTML.`
            );

            markdownTarget.innerHTML = `
              <div class="markdown-error">
                Markdownを表示できませんでした。
              </div>
            `;

            return false;
          }

          markdownTarget.innerHTML = renderedHtml;

          console.log(
            `${LOG_PREFIX} Markdown rendered successfully.`
          );

          return true;
        } catch (error) {
          console.error(
            `${LOG_PREFIX} Failed to render Markdown.`,
            error
          );

          markdownTarget.innerHTML = `
            <div class="markdown-error">
              Markdownの解析中にエラーが発生しました。
            </div>
          `;

          return false;
        }
      };

      if (typeof window.marked !== "undefined") {
        console.log(
          `${LOG_PREFIX} marked is already available.`
        );

        renderMarkdown();
        return;
      }

      console.log(
        `${LOG_PREFIX} Loading marked.`
      );

      const markedScript =
        document.createElement("script");

      markedScript.src =
        "https://cdn.jsdelivr.net/npm/marked@18.0.13/lib/marked.umd.js";

      markedScript.async = true;

      markedScript.onload = () => {
        console.log(
          `${LOG_PREFIX} marked loaded successfully.`
        );

        renderMarkdown();
      };

      markedScript.onerror = (error) => {
        console.error(
          `${LOG_PREFIX} Failed to load marked.`,
          error
        );

        markdownTarget.innerHTML = `
          <div class="markdown-error">
            Markdownパーサーを読み込めませんでした。
          </div>
        `;
      };

      document.head.appendChild(markedScript);

      console.log(
        `${LOG_PREFIX} marked script appended to document head.`
      );
    })();
  </script>
