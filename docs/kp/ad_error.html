  <script>
    (() => {
      "use strict";

      const LOG_PREFIX = "[Sentaro Support]";
      const CONTACT_FORM_URL =
        "https://docs.google.com/forms/d/e/1FAIpQLSegCKF2UdLdEA7cQ6y3PS3vlZ8fT29KnEyo26RDl15ocIM1Ig/viewform?usp=sharing&ouid=116246090197695118669";

      const markdownText = "# \"리용규칙을 위배했습니다\"가 가리키는 경우\n\n사이트를 조망하는 과정에 다음과 같은 오유 메쎄지가 뜨는 경우의 대처방법을 안출해드립니다.\n\n> **가리키는 메쎄지 보기**\n> 리용규칙을 위배했습니다\n> 손님의 브라우저에서 광고사단기가 확인되였습니다.\n> Search3958 사이트를 리용하시려면 리용규칙에 동의한것으로 인정합니다.\n> 많은 문제를 피하려면 광고를 허용하거나 리용규칙 동의를 철회하십시오.\n\n---\n\n## 대처방법\n\n### 1. 광고사단기(확장프로그람)를 사용하는 경우\n\n사이트를 리용하려면 광고사단기를 비활성화하거나 이 사이트를 예외목록에 등록해야 합니다.\n\n* **설정변경 방법**\n* 브라우저 확장프로그람 설정에서 이 사이트(Search3958)를 \"사단제외(예외목록)\"에 등록하십시오.\n* 확장프로그람을 삭제하는 경우 Chrome Web Store 등에서 안설치(끄기)하십시오.\n* 오유화면의 \"광고허용\" 단추에서 Chrome Web Store에 접속할수도 있습니다.\n\n---\n\n### 2. 광고사단기를 사용하지 않는 경우 / 사단기를 꺼도 해결되지 않는 경우\n\n브라우저의 개인정보보호 및 보안기능이나 추적방지기능이 영향을 주고있을수 있습니다.\n\n* **브라우저 보안 및 개인정보보호 설정 확인**\n* **Microsoft Edge를 사용하는 경우**\n\n> 설정메뉴의 \"개인정보, 검색, 봉사\" 내 \"추적방지\" 강도를 \"엄격\"에서 \"기본\" 또는 \"균형\"으로 바꾸면 해결될수 있습니다.\n\n* **기타 브라우저(Chrome / Safari / Firefox 등)를 사용하는 경우**\n\n> 마찬가지로 과도한 추적방지기능이나 서드파티 쿠키제한이 원인으로 될수 있습니다. 일시적으로 보안수준을 완화해보십시오.\n\n* **\"동의를 철회했습니다\"라는 화면이 뜨는 경우**\n\n> 화면의 \"리용규칙에 동의하기\"를 눌러 원래 화면으로 돌아가십시오.\n\n---\n\n## 운영자 요청\n\n이 사이트는 가리키는 광고수익으로 봉사의 유지 및 개선을 진행하고있습니다.\n\n따라서 광고사단기 사용은 이 사이트의 리용규칙위배에 해당됩니다. 지속적인 봉사운영을 위하여 광고사단기 해제 및 이 사이트에서의 광고표시에 대한 리해와 협조를 부탁드립니다.";
      const markdownTarget = document.getElementById("support-markdown");
      const contactButton = document.getElementById("support-contact-button");

      if (contactButton) {
        contactButton.addEventListener("click", () => {
          window.location.href = CONTACT_FORM_URL;
        });
      }

      const renderError = (message) => {
        if (markdownTarget) {
          markdownTarget.innerHTML =
            '<div class="markdown-error"></div>';
          const error = markdownTarget.querySelector(".markdown-error");
          if (error) error.textContent = message;
        }
      };

      if (!markdownTarget) {
        console.error(`${LOG_PREFIX} Markdown target element was not found.`);
        return;
      }

      if (!markdownText.trim()) {
        renderError("Markdown 내용이 없습니다.");
        return;
      }

      const renderMarkdown = () => {
        if (typeof window.marked === "undefined") {
          renderError("Markdown 파서를 불러오지 못했습니다.");
          return false;
        }

        try {
          const renderedHtml = window.marked.parse(markdownText, {
            gfm: true,
            breaks: false
          });

          if (!renderedHtml) {
            renderError("Markdown을 표시할 수 없습니다.");
            return false;
          }

          markdownTarget.innerHTML = renderedHtml;
          return true;
        } catch (error) {
          console.error(`${LOG_PREFIX} Failed to render Markdown.`, error);
          renderError("Markdown을 해석하는 중 오류가 발생했습니다.");
          return false;
        }
      };

      if (typeof window.marked !== "undefined") {
        renderMarkdown();
        return;
      }

      const markedScript = document.createElement("script");
      markedScript.src =
        "https://cdn.jsdelivr.net/npm/marked@18.0.13/lib/marked.umd.js";
      markedScript.async = true;

      markedScript.onload = renderMarkdown;
      markedScript.onerror = () => renderError("Markdown 파서를 불러오지 못했습니다.");

      document.head.appendChild(markedScript);
    })();
  </script>
