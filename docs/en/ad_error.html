  <script>
    (() => {
      "use strict";

      const LOG_PREFIX = "[Sentaro Support]";
      const CONTACT_FORM_URL =
        "https://docs.google.com/forms/d/e/1FAIpQLSegCKF2UdLdEA7cQ6y3PS3vlZ8fT29KnEyo26RDl15ocIM1Ig/viewform?usp=sharing&ouid=116246090197695118669";

      const markdownText = "# When You See \"You Are in Violation of the Terms of Use\"\n\nThis page provides guidance on how to handle the following error message that appears while browsing the site.\n\n> **Example Messages Displayed**\n> You are in violation of the terms of use\n> An ad blocker was detected in your browser.\n> By using the Search3958 site, you are deemed to have agreed to the terms of use.\n> To avoid many issues, please allow ads or withdraw your agreement to the terms of use.\n\n---\n\n## Solutions\n\n### 1. If You Are Using an Ad Blocker (Extension)\n\nTo use the site, you need to disable the ad blocker or add this site to the exclusion list.\n\n* **How to Change Settings**\n* In your browser's extension settings, register this site (Search3958) in the \"Allowlist\" or \"Exceptions\" list.\n* If you want to remove the extension, uninstall it from the Chrome Web Store or similar.\n* You can also access the Chrome Web Store from the \"Allow Ads\" button on the error screen.\n\n\n\n---\n\n### 2. If You Are Not Using an Ad Blocker / The Issue Persists Even When Disabled\n\nYour browser's privacy and security features or tracking prevention features may be affecting the site.\n\n* **Check Browser Security & Privacy Settings**\n* **If you are using Microsoft Edge**\n> Changing the tracking prevention intensity from \"Strict\" to \"Basic\" or \"Balanced\" in the \"Privacy, search, and services\" settings menu may resolve the issue.\n* **If you are using other browsers (Chrome / Safari / Firefox, etc.)**\n> Similarly, excessive tracking prevention features or restrictions on third-party cookies may be the cause. Temporarily relax the security level and try again.\n\n\n\n* **If a screen saying \"You have withdrawn consent\" is displayed**\n> Click \"Agree to Terms of Use\" on the screen to return to the original page.\n\n---\n\n## Request from the Administrators\n\nThis site is maintained and improved through the revenue generated from displayed ads.\n\nTherefore, using an ad blocker constitutes a violation of this site's terms of use. For the sustainable operation of our service, we kindly ask for your understanding and cooperation in disabling ad blockers and allowing ads to be displayed on this site.";
      const markdownTarget = document.getElementById("support-markdown");
      const contactButton = document.getElementById("support-contact-button");

      if (contactButton) {
        contactButton.addEventListener("click", () => {
          window.location.href = CONTACT_FORM_URL;
        });
      }

      const renderError = (message) => {
        if (markdownTarget) {
          markdownTarget.innerHTML =
            '<div class="markdown-error"></div>';
          const error = markdownTarget.querySelector(".markdown-error");
          if (error) error.textContent = message;
        }
      };

      if (!markdownTarget) {
        console.error(`${LOG_PREFIX} Markdown target element was not found.`);
        return;
      }

      if (!markdownText.trim()) {
        renderError("There is no Markdown content.");
        return;
      }

      const renderMarkdown = () => {
        if (typeof window.marked === "undefined") {
          renderError("Failed to load the Markdown parser.");
          return false;
        }

        try {
          const renderedHtml = window.marked.parse(markdownText, {
            gfm: true,
            breaks: false
          });

          if (!renderedHtml) {
            renderError("The Markdown content could not be displayed.");
            return false;
          }

          markdownTarget.innerHTML = renderedHtml;
          return true;
        } catch (error) {
          console.error(`${LOG_PREFIX} Failed to render Markdown.`, error);
          renderError("An error occurred while parsing Markdown.");
          return false;
        }
      };

      if (typeof window.marked !== "undefined") {
        renderMarkdown();
        return;
      }

      const markedScript = document.createElement("script");
      markedScript.src =
        "https://cdn.jsdelivr.net/npm/marked@18.0.13/lib/marked.umd.js";
      markedScript.async = true;

      markedScript.onload = renderMarkdown;
      markedScript.onerror = () => renderError("Failed to load the Markdown parser.");

      document.head.appendChild(markedScript);
    })();
  </script>
