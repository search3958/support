  <script>
    (() => {
      "use strict";

      const LOG_PREFIX = "[Sentaro Support]";
      const CONTACT_FORM_URL =
        "https://docs.google.com/forms/d/e/1FAIpQLSegCKF2UdLdEA7cQ6y3PS3vlZ8fT29KnEyo26RDl15ocIM1Ig/viewform?usp=sharing&ouid=116246090197695118669";

      const markdownText = "# 「利用規約に違反しています」と表示される場合\n\nサイトの閲覧中に以下のエラーメッセージが表示された場合の対処方法をご案内します。\n\n> **表示されるメッセージの例**\n> 利用規約に違反しています\n> お客様のブラウザで広告ブロッカーが確認されました。\n> Search3958のサイトをご利用いただく場合、利用規約に同意したものとみなします。\n> 多くの問題を避けるためには広告を許可するか、利用規約への同意を撤回してください。\n\n---\n\n## 対処方法\n\n### 1. 広告ブロッカー（拡張機能）を使用している場合\n\nサイトをご利用いただくには、広告ブロッカーの無効化または本サイトの除外設定が必要です。\n\n* **設定の変更方法**\n* ブラウザの拡張機能設定から、当サイト（Search3958）を「ブロックの対象外（除外リスト）」に登録してください。\n* 拡張機能を削除する場合は、Chrome Web Store等からアンインストールを行ってください。\n* エラー画面上の「広告を許可」ボタンからも Chrome Web Store へアクセスできます。\n\n\n\n---\n\n### 2. 広告ブロッカーを使用していない／オフにしても解消されない場合\n\nブラウザのプライバシーセーフティ機能やトラッキング防止機能が影響している可能性があります。\n\n* **ブラウザのセキュリティ・プライバシー設定の確認**\n* **Microsoft Edge をお使いの場合**\n設定メニューの「プライバシー、検索、サービス」内にある**トラッキング防止**の強度を「厳重」から「基本」または「バランス」に変更することで解決する場合があります。\n* **その他のブラウザ（Chrome / Safari / Firefox など）をお使いの場合**\n同様に、過度なトラッキング防止機能やサードパーティ製Cookieの制限が原因となることがあります。一時的にセキュリティレベルを緩和してお試しください。\n\n\n* **「同意を撤回しています」という画面が表示された場合**\n画面内の「利用規約に同意する」をクリックして元の画面へお戻りください。\n\n---\n\n## 運営からのお願い\n\n当サイトは、表示される広告収入によってサービスの維持および改善を行っております。\n\nそのため、広告ブロッカーのご利用は本サイトの利用規約違反となります。持続的なサービス運営のため、広告ブロッカーの解除および当サイトでの広告表示にご理解とご協力をよろしくお願いいたします。";
      const markdownTarget = document.getElementById("support-markdown");
      const contactButton = document.getElementById("support-contact-button");

      if (contactButton) {
        contactButton.addEventListener("click", () => {
          window.location.href = CONTACT_FORM_URL;
        });
      }

      const renderError = (message) => {
        if (markdownTarget) {
          markdownTarget.innerHTML =
            '<div class="markdown-error"></div>';
          const error = markdownTarget.querySelector(".markdown-error");
          if (error) error.textContent = message;
        }
      };

      if (!markdownTarget) {
        console.error(`${LOG_PREFIX} Markdown target element was not found.`);
        return;
      }

      if (!markdownText.trim()) {
        renderError("Markdownの内容がありません。");
        return;
      }

      const renderMarkdown = () => {
        if (typeof window.marked === "undefined") {
          renderError("Markdownパーサーの読み込みに失敗しました。");
          return false;
        }

        try {
          const renderedHtml = window.marked.parse(markdownText, {
            gfm: true,
            breaks: false
          });

          if (!renderedHtml) {
            renderError("Markdownを表示できませんでした。");
            return false;
          }

          markdownTarget.innerHTML = renderedHtml;
          return true;
        } catch (error) {
          console.error(`${LOG_PREFIX} Failed to render Markdown.`, error);
          renderError("Markdownの解析中にエラーが発生しました。");
          return false;
        }
      };

      if (typeof window.marked !== "undefined") {
        renderMarkdown();
        return;
      }

      const markedScript = document.createElement("script");
      markedScript.src =
        "https://cdn.jsdelivr.net/npm/marked@18.0.13/lib/marked.umd.js";
      markedScript.async = true;

      markedScript.onload = renderMarkdown;
      markedScript.onerror = () => renderError("Markdownパーサーの読み込みに失敗しました。");

      document.head.appendChild(markedScript);
    })();
  </script>
