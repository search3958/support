  <script>
    (() => {
      "use strict";

      const LOG_PREFIX = "[Sentaro Support]";
      const CONTACT_FORM_URL =
        "https://docs.google.com/forms/d/e/1FAIpQLSegCKF2UdLdEA7cQ6y3PS3vlZ8fT29KnEyo26RDl15ocIM1Ig/viewform?usp=sharing&ouid=116246090197695118669";

      const markdownText = "# SaeTab for Chrome 安装指南\n\n## 1. 下载 SaeTab\n\n从下方链接下载 ZIP 文件。\n\n[**下载 SaeTab for Chrome**](https://github.com/search3958/newtab/raw/refs/heads/main/saetab-for-chrome.zip)\n\n## 2. 解压 ZIP 文件\n\n右键点击下载的 `saetab-for-chrome.zip`，选择 **\"全部解压\"** 进行解压。\n\n确认解压后的文件夹中有 `background.js` 等文件。\n\n## 3. 打开 Chrome 扩展程序页面\n\n在 Chrome 地址栏输入以下内容，打开扩展程序管理界面。\n此时，请务必从右上角的开关启用**开发者模式**。\n\n`chrome://extensions/`\n\n## 4. 加载扩展程序\n\n点击画面右上角的 **\"加载已解压的扩展程序\"**。\n\n选择解压 ZIP 文件的文件夹。\n\n**关键是选择直接包含 `background.js` 的文件夹。**\n\n## 5. 完成\n\n如果扩展程序列表中显示 **SaeTab**，则安装完成。\n\n现在可以使用 SaeTab 了。";
      const markdownTarget = document.getElementById("support-markdown");
      const contactButton = document.getElementById("support-contact-button");

      if (contactButton) {
        contactButton.addEventListener("click", () => {
          window.location.href = CONTACT_FORM_URL;
        });
      }

      const renderError = (message) => {
        if (markdownTarget) {
          markdownTarget.innerHTML =
            '<div class="markdown-error"></div>';
          const error = markdownTarget.querySelector(".markdown-error");
          if (error) error.textContent = message;
        }
      };

      if (!markdownTarget) {
        console.error(`${LOG_PREFIX} Markdown target element was not found.`);
        return;
      }

      if (!markdownText.trim()) {
        renderError("没有可用的 Markdown 内容。");
        return;
      }

      const renderMarkdown = () => {
        if (typeof window.marked === "undefined") {
          renderError("Markdown 解析器加载失败。");
          return false;
        }

        try {
          const renderedHtml = window.marked.parse(markdownText, {
            gfm: true,
            breaks: false
          });

          if (!renderedHtml) {
            renderError("无法显示 Markdown 内容。");
            return false;
          }

          markdownTarget.innerHTML = renderedHtml;
          return true;
        } catch (error) {
          console.error(`${LOG_PREFIX} Failed to render Markdown.`, error);
          renderError("解析 Markdown 时发生错误。");
          return false;
        }
      };

      if (typeof window.marked !== "undefined") {
        renderMarkdown();
        return;
      }

      const markedScript = document.createElement("script");
      markedScript.src =
        "https://cdn.jsdelivr.net/npm/marked@18.0.13/lib/marked.umd.js";
      markedScript.async = true;

      markedScript.onload = renderMarkdown;
      markedScript.onerror = () => renderError("Markdown 解析器加载失败。");

      document.head.appendChild(markedScript);
    })();
  </script>
