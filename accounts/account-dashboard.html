<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>0f8 Account Dashboard</title>
  <link rel="stylesheet" href="account-service.css">
</head>
<body>
  <main class="account-page">
    <header class="account-header">
      <h1 class="account-title">0f8 Account Dashboard</h1>
      <p class="account-subtitle">アカウント情報、保存容量、認証状態を管理します。</p>
    </header>
    <section id="login-card" class="account-card">
      <button id="dashboard-login" class="account-button" type="button">ログイン</button>
      <p id="dashboard-login-status" class="account-status" aria-live="polite"></p>
    </section>
    <section id="dashboard-card" class="account-card account-hidden">
      <div class="dashboard-grid">
        <div>
          <img id="account-icon" class="dashboard-avatar" alt="アカウントアイコン" hidden>
          <p id="account-id" class="account-note"></p>
          <p id="management-origin-status" class="account-status" aria-live="polite"></p>
        </div>

        <form id="profile-form" class="dashboard-row" novalidate>
          <div class="account-field">
            <label for="account-name">名前</label>
            <input id="account-name" maxlength="80" required>
          </div>
          <input id="account-icon-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif">
          <div class="dashboard-row two">
            <button id="remove-icon" class="account-button secondary" type="button">アイコンを削除</button>
            <button id="save-profile" class="account-button" type="submit">保存</button>
          </div>
          <p id="profile-status" class="account-status" aria-live="polite"></p>
        </form>

        <section class="dashboard-row">
          <h2>使用容量</h2>
          <div class="usage-summary">
            <div><span>保存データ</span><strong id="usage-total">-</strong></div>
            <div><span>アイコン</span><strong id="usage-icon">-</strong></div>
            <div><span>合計</span><strong id="usage-account-total">-</strong></div>
          </div>
          <p id="usage-status" class="account-status" aria-live="polite"></p>
          <div class="usage-table-wrap">
            <table class="usage-table">
              <thead><tr><th>ドメイン</th><th>Base122</th><th>容量</th><th>操作</th></tr></thead>
              <tbody id="usage-domains"></tbody>
            </table>
          </div>
          <button id="refresh-usage" class="account-button secondary" type="button">容量を更新</button>
        </section>

        <form id="password-form" class="dashboard-row" novalidate>
          <div class="account-field">
            <label for="current-password">現在のパスワード</label>
            <input id="current-password" type="password" minlength="8" maxlength="128" autocomplete="current-password" required>
          </div>
          <div class="account-field">
            <label for="new-password">新しいパスワード</label>
            <input id="new-password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required>
          </div>
          <button class="account-button" type="submit">パスワードを変更</button>
          <p id="password-status" class="account-status" aria-live="polite"></p>
        </form>

        <div class="dashboard-actions">
          <button id="logout-all" class="account-button secondary" type="button">すべての端末からログアウト</button>
          <button id="logout" class="account-button secondary" type="button">この端末からログアウト</button>
          <button id="delete-account" class="account-button secondary" type="button">アカウントを削除</button>
          <p id="dashboard-status" class="account-status" aria-live="polite"></p>
        </div>
      </div>
    </section>
  </main>
  <script src="account-dashboard.js"></script>
</body>
</html>
